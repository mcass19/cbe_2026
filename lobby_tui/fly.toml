app = "lobby-tui"
primary_region = "ams"
console_command = "/app/bin/lobby_tui remote"

[build]

[env]
  PHX_HOST = "lobby-tui.fly.dev"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
