app = "lobby-tui"
primary_region = "ams"
console_command = "/app/bin/lobby_tui remote"
kill_signal = "SIGTERM"

[build]

[env]
  PHX_HOST = "lobby-tui.fly.dev"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
