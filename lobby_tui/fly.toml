# fly.toml app configuration file generated for lobby-tui on 2026-08-02T19:33:48+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lobby-tui'
primary_region = 'ams'
kill_signal = 'SIGTERM'
console_command = '/app/bin/lobby_tui remote'

[build]
[env]
  PHX_HOST = 'lobby-tui.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[services]]
  protocol = 'tcp'
  internal_port = 2222
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 22

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
